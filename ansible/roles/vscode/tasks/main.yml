---
- name: Check for the VS Code CLI
  become: false
  ansible.builtin.command: code --version
  register: vscode_cli
  changed_when: false
  failed_when: false

- name: List installed VS Code extensions
  become: false
  ansible.builtin.command: code --list-extensions
  register: vscode_installed_extensions
  changed_when: false
  when: vscode_cli.rc == 0

- name: Install managed VS Code extensions
  become: false
  ansible.builtin.command:
    argv:
      - code
      - --install-extension
      - "{{ item }}"
  loop: "{{ lookup('file', vscode_extensions_file) | from_json }}"
  when:
    - vscode_cli.rc == 0
    - item not in vscode_installed_extensions.stdout_lines
  changed_when: true

- name: Report when the VS Code CLI is unavailable
  ansible.builtin.debug:
    msg: Skipping VS Code extensions because the `code` CLI is not installed.
  when: vscode_cli.rc != 0
