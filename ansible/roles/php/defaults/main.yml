---
# Build dependencies for mise's vfox PHP backend and its common extensions.
php_build_packages:
  - build-essential
  - autoconf
  - bison
  - re2c
  - pkg-config
  - libxml2-dev
  - libssl-dev
  - libicu-dev
  - libzip-dev
  - libonig-dev
  - libcurl4-openssl-dev
  - libsqlite3-dev
  - libpng-dev
  - libjpeg-dev
  - libfreetype6-dev
  - libwebp-dev
  - libgmp-dev
  - libsodium-dev
  - libreadline-dev
  - libbz2-dev
  - zlib1g-dev
