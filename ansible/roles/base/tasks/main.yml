---
- name: Install common workstation prerequisites
  become: true
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install native dependency build tools for selected languages
  become: true
  ansible.builtin.apt:
    name: "{{ base_native_packages }}"
    state: present
  when: workstation_languages | intersect(['node', 'python', 'go', 'bun', 'php']) | length > 0
