---
- name: Update APT cache
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install selected CLI tools
  become: true
  ansible.builtin.apt:
    name: "{{ cli_tools_packages }}"
    state: present

- name: Resolve the mise-owned replacements before removing older installations
  become: false
  ansible.builtin.command:
    argv: ["{{ mise_binary }}", which, "{{ item }}"]
  environment:
    MISE_CONFIG_FILE: "{{ mise_config_dest }}"
  loop: "{{ cli_tools_mise_commands }}"
  register: cli_tools_mise_paths
  changed_when: false
  tags: [cli_tools_migration, cli_tools_legacy_launchers]

- name: Require replacements inside the managed mise installation tree
  ansible.builtin.assert:
    that:
      - item.stdout is match('^' ~ ((workstation_home ~ '/.local/share/mise/installs/') | regex_escape))
    fail_msg: Install the pinned mise tools before retiring distribution packages or user launchers.
  loop: "{{ cli_tools_mise_paths.results }}"
  loop_control:
    label: "{{ item.item }}"
  tags: [cli_tools_migration, cli_tools_legacy_launchers]

- name: Inspect resolved replacement executables
  become: false
  ansible.builtin.stat:
    path: "{{ item.stdout | trim }}"
    follow: true
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop: "{{ cli_tools_mise_paths.results }}"
  register: cli_tools_mise_executables
  tags: [cli_tools_migration, cli_tools_legacy_launchers]

- name: Require all replacement executables before cleanup
  ansible.builtin.assert:
    that:
      - item.stat.isreg | default(false)
      - item.stat.executable | default(false)
  loop: "{{ cli_tools_mise_executables.results }}"
  loop_control:
    label: "{{ item.item.item }}"
  tags: [cli_tools_migration, cli_tools_legacy_launchers]

- name: Retire positively identified user-local installation remnants
  ansible.builtin.import_tasks: legacy-launchers.yml
  tags: [cli_tools_migration, cli_tools_legacy_launchers]

- name: Inspect distribution packages before targeted retirement
  ansible.builtin.package_facts:
    manager: apt
  tags: [cli_tools_migration]

- name: Select only installed legacy packages not explicitly retained
  ansible.builtin.set_fact:
    cli_tools_packages_to_retire: "{{ cli_tools_legacy_packages | intersect(ansible_facts.packages.keys() | list) | difference(cli_tools_packages) }}"
  tags: [cli_tools_migration]

- name: Retire legacy CLI packages without removing dependent or unrelated packages
  become: true
  ansible.builtin.command:
    argv: "{{ ['/usr/bin/dpkg', '--remove', '--'] + cli_tools_packages_to_retire }}"
  when: cli_tools_packages_to_retire | length > 0
  changed_when: true
  tags: [cli_tools_migration]
