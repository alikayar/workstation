---
- name: Update APT cache
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install selected CLI tools
  become: true
  ansible.builtin.apt:
    name: "{{ cli_tools_packages }}"
    state: present

- name: Preserve linked paths and commands not managed by Workstation
  become: false
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - |
        from pathlib import Path
        import sys
        path = Path(sys.argv[1]).absolute()
        if any(p.is_symlink() for p in (path, *path.parents)):
            raise SystemExit('Linked command path retained; review ownership.')
        if path.exists():
            if not path.is_file() or path.stat().st_size > 65536:
                raise SystemExit('Unexpected command destination retained.')
            with path.open('rb') as source:
                if ('# Workstation managed ' + sys.argv[2] + ' v1').encode() not in source.read(256):
                    raise SystemExit('Unmanaged command retained; review ownership.')
      - "{{ workstation_home }}/.local/bin/{{ item }}"
      - "{{ item }}"
  loop:
    - workstation-doctor
    - workstation-service
  changed_when: false
  check_mode: false
  tags: [cli_tools_config]

- name: Ensure the user-local command directory exists
  become: false
  ansible.builtin.file:
    path: "{{ workstation_home }}/.local/bin"
    state: directory
    mode: '0755'
  tags: [cli_tools_config]

- name: Install workstation diagnostics and task service commands
  become: false
  ansible.builtin.copy:
    src: "{{ item }}.py"
    dest: "{{ workstation_home }}/.local/bin/{{ item }}"
    mode: '0755'
  tags: [cli_tools_config]
  loop:
    - workstation-doctor
    - workstation-service
