---
- name: Configure task-scoped browser automation
  ansible.builtin.import_tasks: agent-browser.yml
  when: agent_tools_browser_enabled | bool
  tags: [agent_browser]

- name: Ensure document converter directories exist
  become: false
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ workstation_home }}/.local/share/workstation", mode: '0700'}
    - {path: "{{ workstation_home }}/.local/bin", mode: '0755'}
  when: agent_tools_markitdown_enabled | bool

- name: Install the reviewed document converter in its own uv environment
  become: false
  ansible.builtin.command:
    argv:
      - "{{ mise_binary }}"
      - exec
      - --
      - uv
      - tool
      - install
      - --python
      - python3
      - --no-python-downloads
      - "markitdown[pdf,docx,pptx,xlsx]=={{ agent_tools_markitdown_version }}"
    chdir: "{{ workstation_home }}"
    creates: "{{ agent_tools_markitdown_dir }}/bin/markitdown"
  environment:
    UV_TOOL_DIR: "{{ agent_tools_markitdown_dir }}/tools"
    UV_TOOL_BIN_DIR: "{{ agent_tools_markitdown_dir }}/bin"
  when: agent_tools_markitdown_enabled | bool

- name: Install the optional document converter launcher
  become: false
  ansible.builtin.template:
    src: markitdown.sh.j2
    dest: "{{ workstation_home }}/.local/bin/workstation-markitdown"
    mode: '0755'
  when: agent_tools_markitdown_enabled | bool
