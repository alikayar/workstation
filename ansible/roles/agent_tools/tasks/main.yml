---
- name: Configure local repository knowledge indexing
  ansible.builtin.import_tasks: graphify.yml
  when: agent_tools_graphify_enabled | bool
  tags: [graphify]

- name: Configure task-scoped browser automation
  ansible.builtin.import_tasks: agent-browser.yml
  when: agent_tools_browser_enabled | bool
  tags: [agent_browser]

- name: Configure native website auditing
  ansible.builtin.import_tasks: lighthouse.yml
  when: agent_tools_lighthouse_enabled | bool
  tags: [lighthouse]

- name: Configure native site crawling
  ansible.builtin.import_tasks: siteone.yml
  when: agent_tools_siteone_enabled | bool
  tags: [siteone]

- name: Configure optional document conversion
  ansible.builtin.import_tasks: markitdown.yml
  when: agent_tools_markitdown_enabled | bool
  tags: [markitdown]
