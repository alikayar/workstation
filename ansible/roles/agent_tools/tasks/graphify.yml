---
- name: Inspect the existing Graphify launcher
  become: false
  ansible.builtin.stat:
    path: "{{ workstation_home }}/.local/bin/workstation-graphify"
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: agent_tools_graphify_launcher

- name: Refuse linked or non-file Graphify launchers
  ansible.builtin.assert:
    that:
      - not (agent_tools_graphify_launcher.stat.islnk | default(false))
      - not agent_tools_graphify_launcher.stat.exists or (agent_tools_graphify_launcher.stat.isreg | default(false))
      - not agent_tools_graphify_launcher.stat.exists or agent_tools_graphify_launcher.stat.size | default(0) < 16384
    fail_msg: Existing workstation-graphify retained; review its ownership before applying.

- name: Read the existing Graphify launcher
  become: false
  ansible.builtin.slurp:
    src: "{{ workstation_home }}/.local/bin/workstation-graphify"
  register: agent_tools_graphify_existing
  when: agent_tools_graphify_launcher.stat.exists

- name: Preserve Graphify launchers not managed by Workstation
  ansible.builtin.assert:
    that: "'# Workstation managed Graphify launcher v1' in (agent_tools_graphify_existing.content | b64decode)"
    fail_msg: Existing workstation-graphify retained; review its ownership before applying.
  when: agent_tools_graphify_launcher.stat.exists

- name: Create user-owned Graphify directories
  become: false
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ workstation_home }}/.local/bin", mode: '0755'}
    - {path: "{{ agent_tools_graphify_dir }}", mode: '0700'}

- name: Install the Graphify Python runtime through mise
  become: false
  ansible.builtin.command:
    argv: ["{{ mise_binary }}", install, "python@{{ agent_tools_graphify_python_version }}"]
    creates: "{{ workstation_home }}/.local/share/mise/installs/python/{{ agent_tools_graphify_python_version }}/bin/python3"
    chdir: "{{ workstation_home }}"

- name: Locate the pinned Graphify Python installation
  become: false
  ansible.builtin.command:
    argv: ["{{ mise_binary }}", where, "python@{{ agent_tools_graphify_python_version }}"]
    chdir: "{{ workstation_home }}"
  register: agent_tools_graphify_python
  changed_when: false
  when: not ansible_check_mode

- name: Install pinned Graphify outside application dependencies
  become: false
  ansible.builtin.command:
    argv:
      - "{{ mise_binary }}"
      - exec
      - "python@{{ agent_tools_graphify_python_version }}"
      - --
      - uv
      - tool
      - install
      - --python
      - "{{ agent_tools_graphify_python.stdout | trim }}/bin/python3"
      - --no-python-downloads
      - "graphifyy=={{ agent_tools_graphify_version }}"
    creates: "{{ agent_tools_graphify_dir }}/tools/graphifyy/bin/graphify"
    chdir: "{{ workstation_home }}"
  environment:
    UV_TOOL_DIR: "{{ agent_tools_graphify_dir }}/tools"
    UV_TOOL_BIN_DIR: "{{ agent_tools_graphify_dir }}/bin"
  when: not ansible_check_mode

- name: Install the local Graphify adapter
  become: false
  ansible.builtin.template:
    src: workstation-graphify.py.j2
    dest: "{{ agent_tools_graphify_dir }}/workstation-graphify.py"
    mode: '0600'

- name: Install the managed Graphify launcher
  become: false
  ansible.builtin.template:
    src: graphify.sh.j2
    dest: "{{ workstation_home }}/.local/bin/workstation-graphify"
    mode: '0755'
