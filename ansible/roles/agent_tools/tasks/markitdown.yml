---
- name: Inspect the existing document converter launcher
  become: false
  ansible.builtin.stat:
    path: "{{ workstation_home }}/.local/bin/workstation-markitdown"
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: agent_tools_markitdown_launcher

- name: Refuse linked or non-file document converter launchers
  ansible.builtin.assert:
    that:
      - not (agent_tools_markitdown_launcher.stat.islnk | default(false))
      - not agent_tools_markitdown_launcher.stat.exists or (agent_tools_markitdown_launcher.stat.isreg | default(false))
      - not agent_tools_markitdown_launcher.stat.exists or agent_tools_markitdown_launcher.stat.size | default(0) < 16384
    fail_msg: Existing workstation-markitdown retained; review its ownership before applying.

- name: Read the existing document converter launcher
  become: false
  ansible.builtin.slurp:
    src: "{{ workstation_home }}/.local/bin/workstation-markitdown"
  register: agent_tools_markitdown_existing
  when: agent_tools_markitdown_launcher.stat.exists

- name: Preserve document converter launchers not managed by Workstation
  ansible.builtin.assert:
    that: "'# Workstation managed document converter launcher v1' in (agent_tools_markitdown_existing.content | b64decode)"
    fail_msg: Existing workstation-markitdown retained; review its ownership before applying.
  when: agent_tools_markitdown_launcher.stat.exists

- name: Ensure document converter directories exist
  become: false
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ workstation_home }}/.local/share/workstation", mode: '0700'}
    - {path: "{{ workstation_home }}/.local/bin", mode: '0755'}

- name: Install the reviewed document converter in its own uv environment
  become: false
  ansible.builtin.command:
    argv:
      - "{{ mise_binary }}"
      - exec
      - --
      - uv
      - tool
      - install
      - --python
      - python3
      - --no-python-downloads
      - "markitdown[pdf,docx,pptx,xlsx]=={{ agent_tools_markitdown_version }}"
    chdir: "{{ workstation_home }}"
    creates: "{{ agent_tools_markitdown_dir }}/bin/markitdown"
  environment:
    UV_TOOL_DIR: "{{ agent_tools_markitdown_dir }}/tools"
    UV_TOOL_BIN_DIR: "{{ agent_tools_markitdown_dir }}/bin"

- name: Install the optional document converter launcher
  become: false
  ansible.builtin.template:
    src: markitdown.sh.j2
    dest: "{{ workstation_home }}/.local/bin/workstation-markitdown"
    mode: '0755'
