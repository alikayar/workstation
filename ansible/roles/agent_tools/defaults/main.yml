---
# One workstation tool; applications keep their own dependencies unchanged.
agent_tools_graphify_enabled: true
# renovate: datasource=pypi depName=graphifyy versioning=pep440
agent_tools_graphify_version: '0.9.103'
agent_tools_graphify_python_version: '3.12.15'
agent_tools_graphify_dir: >-
  {{ workstation_home }}/.local/share/workstation/graphify-{{ agent_tools_graphify_version
  }}-py{{ agent_tools_graphify_python_version }}

# Chrome for Testing has no Linux ARM64 asset; other roles still support ARM64.
agent_tools_browser_enabled: "{{ ansible_facts['architecture'] == 'x86_64' }}"
agent_tools_browser_chrome_version: '157.0.8103.38'
agent_tools_browser_chrome_sha256: '8cdeb344e9b2cefe59f4aea8d1d93d5d93054c03cde217665c16fc1f62e72a66'
agent_tools_browser_chrome_dir: "/opt/workstation/chrome-for-testing/{{ agent_tools_browser_chrome_version }}"

agent_tools_browser_packages:
  - ca-certificates
  - unzip
  - apparmor
  - libasound2t64
  - libatk-bridge2.0-0t64
  - libatk1.0-0t64
  - libatspi2.0-0t64
  - libcairo2
  - libcups2t64
  - libdbus-1-3
  - libdrm2
  - libgbm1
  - libgtk-3-0t64
  - libnspr4
  - libnss3
  - libpango-1.0-0
  - libx11-6
  - libxcb1
  - libxcomposite1
  - libxdamage1
  - libxext6
  - libxfixes3
  - libxkbcommon0
  - libxrandr2
  - fonts-liberation
  - fonts-noto-color-emoji
