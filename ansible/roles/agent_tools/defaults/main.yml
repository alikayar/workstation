---
# Document conversion is optional.
agent_tools_markitdown_enabled: false
agent_tools_markitdown_version: '0.1.9'
agent_tools_markitdown_dir: "{{ workstation_home }}/.local/share/workstation/markitdown-{{ agent_tools_markitdown_version }}"

# Chrome for Testing has no Linux ARM64 asset; other roles still support ARM64.
agent_tools_browser_enabled: "{{ ansible_facts['architecture'] == 'x86_64' }}"
agent_tools_browser_version: '0.41.2'
agent_tools_browser_sha256: 'c4351f3802ffa5254d8c69f20a52e2fcf56925c6016fcf4203db25a07d811379'
agent_tools_browser_install_dir: "/opt/workstation/agent-browser/{{ agent_tools_browser_version }}"
agent_tools_browser_chrome_version: '157.0.8103.38'
agent_tools_browser_chrome_sha256: '8cdeb344e9b2cefe59f4aea8d1d93d5d93054c03cde217665c16fc1f62e72a66'
agent_tools_browser_chrome_dir: "/opt/workstation/chrome-for-testing/{{ agent_tools_browser_chrome_version }}"
agent_tools_browser_output_dir: "{{ workstation_home }}/.local/share/workstation/browser-tasks"
agent_tools_browser_idle_timeout: '5m'
agent_tools_browser_packages:
  - ca-certificates
  - unzip
  - apparmor
  - libasound2t64
  - libatk-bridge2.0-0t64
  - libatk1.0-0t64
  - libatspi2.0-0t64
  - libcairo2
  - libcups2t64
  - libdbus-1-3
  - libdrm2
  - libgbm1
  - libgtk-3-0t64
  - libnspr4
  - libnss3
  - libpango-1.0-0
  - libx11-6
  - libxcb1
  - libxcomposite1
  - libxdamage1
  - libxext6
  - libxfixes3
  - libxkbcommon0
  - libxrandr2
  - fonts-liberation
  - fonts-noto-color-emoji
