---
- name: Install Docker repository prerequisites
  become: true
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present

- name: Ensure the APT keyring directory exists
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Install the Docker repository key
  become: true
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Read the Docker repository key fingerprint
  become: true
  ansible.builtin.command:
    argv:
      - gpg
      - --batch
      - --show-keys
      - --with-colons
      - /etc/apt/keyrings/docker.asc
  register: docker_repository_key
  changed_when: false
  when: not ansible_check_mode

- name: Verify the Docker repository key fingerprint
  ansible.builtin.assert:
    that:
      - >-
        ('fpr:::::::::' ~ docker_repository_key_fingerprint ~ ':') in
        docker_repository_key.stdout_lines
    fail_msg: The Docker repository key fingerprint did not match the pinned value.
  when: not ansible_check_mode

- name: Remove the legacy Docker repository definition
  become: true
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: Configure the Docker APT repository
  become: true
  ansible.builtin.deb822_repository:
    name: docker
    types:
      - deb
    uris:
      - https://download.docker.com/linux/ubuntu
    suites:
      - "{{ ansible_facts['distribution_release'] }}"
    components:
      - stable
    architectures:
      - "{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' }}"
    signed_by: /etc/apt/keyrings/docker.asc
    state: present
  notify: Update the APT cache after Docker repository changes

- name: Flush Docker repository handlers before package installation
  ansible.builtin.meta: flush_handlers

- name: Install Docker Engine and plugins
  become: true
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present

- name: Add the user to the Docker group
  become: true
  ansible.builtin.user:
    name: "{{ workstation_user }}"
    groups: docker
    append: true

- name: Remind the user to refresh the current shell  # noqa no-handler
  ansible.builtin.debug:
    msg: >-
      Docker setup complete. Run `newgrp docker` or start a new terminal if
      this shell does not yet recognize the docker group.

- name: Enable and start Docker
  become: true
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
