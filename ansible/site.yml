---
- name: Configure the local workstation
  hosts: localhost
  connection: local
  gather_facts: true

  pre_tasks:
    - name: Check platform, user and privilege escalation before applying roles
      ansible.builtin.import_tasks: tasks/preflight.yml
      tags: [always]

  roles:
    - role: shell
      tags: [shell, zsh]
    - role: git
      tags: [git]
    - role: codex
      tags: [codex]
    - role: mise
      tags: [mise, runtimes]
    - role: cli_tools
      tags: [cli, cli_tools]
    - role: docker
      tags: [docker, containers]
