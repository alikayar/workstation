<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="A synthetic loopback fixture for Workstation browser contracts.">
<title>Workstation browser fixture</title>
<link rel="icon" href="data:,">
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #f4f7fa; color: #172a3a; font: 18px system-ui; }
main { max-width: 760px; margin: 32px auto; padding: 24px; }
form { display: grid; gap: 16px; }
input, button { font: inherit; padding: 12px; max-width: 100%; }
button { background: #164a70; color: white; border: 0; }
img { width: 32px; height: 32px; }
@media (max-width: 480px) { main { margin: 0; padding: 16px; } }
</style>
</head>
<body><main>
<h1>Publish a guide</h1>
<img alt="Fixture marker" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
<form id="publish-form">
<label for="title">Guide title</label><input id="title" name="title" required>
<button type="submit">Publish</button>
</form>
<p id="status" role="status">Loading</p>
<script>
const key = new URL(location.href).searchParams.get('case') || 'default';
async function refresh() {
  const state = await fetch('/api/state?case=' + encodeURIComponent(key)).then(r => r.json());
  document.querySelector('#status').textContent = state.title ? 'Published: ' + state.title : 'Ready to publish';
}
document.querySelector('#publish-form').addEventListener('submit', async event => {
  event.preventDefault();
  const response = await fetch('/api/publish?case=' + encodeURIComponent(key), {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({title: document.querySelector('#title').value})
  });
  if (!response.ok) { document.querySelector('#status').textContent = 'Publish failed'; return; }
  await refresh();
});
refresh();
</script>
</main></body></html>
