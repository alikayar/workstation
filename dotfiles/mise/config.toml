[tools]
{% if 'node' in workstation_languages %}
# renovate: datasource=node-version depName=node versioning=node
node = "26.13.0"
{% endif %}
{% if 'python' in workstation_languages %}
# renovate: datasource=python-version depName=python versioning=python
python = "3.15.2"
{% endif %}
{% if 'go' in workstation_languages %}
# renovate: datasource=golang-version depName=go versioning=semver
go = "1.27.3"
{% endif %}
{% if 'bun' in workstation_languages %}
# renovate: datasource=github-releases depName=oven-sh/bun versioning=semver extractVersion=^bun-v(?<version>\d+\.\d+\.\d+)$
bun = "1.4.4"
{% endif %}
{% if 'php' in workstation_languages %}
# renovate: datasource=github-tags depName=php/php-src versioning=semver extractVersion=^php-(?<version>\d+\.\d+\.\d+)$
php = "8.5.12"
{% endif %}

