model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
model_verbosity = "low"
web_search = "live"

sandbox_mode = "danger-full-access"
approval_policy = { granular = { sandbox_approval = false, rules = true, mcp_elicitations = false } }

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."sites@openai-bundled"]
enabled = true

[plugins."drawio@drawio"]
enabled = true

# Hosted, documentation-only MCP; no extra runtime, process or secret in git.
# Unauthenticated requests may have lower rate limits.
[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
required = false
startup_timeout_sec = 20

# Browser debugging and performance traces with the managed local Chrome.
[mcp_servers.chrome_devtools]
command = "npx"
args = [
  "-y", "chrome-devtools-mcp@1.12.0", "--headless", "--isolated", "--page-id-routing",
  "--no-usage-statistics", "--no-performance-crux",
  "--executablePath={{ agent_tools_browser_chrome_dir }}/chrome-linux64/chrome",
]
enabled = {{ agent_tools_browser_enabled | bool | to_json }}
startup_timeout_sec = 120
required = false

[marketplaces.drawio]
source_type = "git"
source = {{ codex_drawio_marketplace | to_json }}
ref = {{ codex_drawio_revision | to_json }}
