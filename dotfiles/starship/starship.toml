"$schema" = "https://starship.rs/config-schema.json"

add_newline = false
scan_timeout = 50
command_timeout = 500

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$container\
$character"""

[directory]
truncation_length = 4
truncate_to_repo = false
home_symbol = "~"
style = "bold blue"

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
ahead = "↑${count}"
behind = "↓${count}"
diverged = "↕↑${ahead_count}↓${behind_count}"
conflicted = "=${count}"
untracked = "?${count}"
modified = "!${count}"
staged = "+${count}"
deleted = "✘${count}"
stashed = "\\$${count}"

[cmd_duration]
min_time = 2000
format = "took [$duration]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"